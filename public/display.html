<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Waiting Display - Token System</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <!-- TV Monitor Icon -->
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/>
          </svg>
        </div>
        <h1 class="brand-title">INVO WAITING TERMINAL</h1>
      </div>
      <div class="live-clock" id="live-clock">--:--:-- AM</div>
    </header>

    <main class="display-layout">
      <!-- Main Serving Section -->
      <section class="serving-hero glass-panel" id="main-serving-panel">
        <div class="serving-title">Now Serving</div>
        <div class="serving-number" id="current-serving-token">----</div>
        <div class="serving-counter" id="current-serving-counter">Counter --</div>
      </section>

      <!-- History Sidebar -->
      <section class="sidebar-display">
        <h2 class="sidebar-title">Recent Calls</h2>
        <div class="history-list" id="history-list">
          <!-- Populated dynamically -->
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p>No tokens called yet today</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Hidden button for browser auto-play policy overlay -->
  <div id="audio-opt-in" class="modal-overlay" style="display: flex;">
    <div class="modal-content glass-panel">
      <h3>Activate Waiting Display</h3>
      <p>Please click the button below to enable real-time chime sounds and voice announcements on this display terminal.</p>
      <button class="btn-primary" id="btn-activate-audio">Activate Audio</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
